[project]
name = "auto-labeling-tool"
version = "0.1.0"
description = "Autonomous data labeling and active learning platform for training YOLO object detection models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imagededup>=0.3.3.post2",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyqt6>=6.11.0",
    "safetensors>=0.8.0",
    "segment-anything>=1.0",
    "termcolor>=3.3.0",
    "torch>=2.7.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.22.0",
    "transformers>=5.14.1",
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

# --- GPU builds of PyTorch ---
# PyPI ships a CPU-only torch on Windows, so the models run on the CPU no matter
# what hardware is present. torch and torchvision are therefore pulled from
# PyTorch's own CUDA 12.8 index instead. The lower bounds above are deliberately
# looser than the CPU wheels allow, because this index trails PyPI by a release
# or two; uv resolves the newest pair the index actually offers.
#
# Requires an NVIDIA driver new enough for CUDA 12.8. Check with `nvidia-smi`.
# To go back to CPU-only, delete these two sections and run `uv sync` again.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# --- Ruff: linter + formatter configuration ---
[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [".venv", "data", "datasets", "runs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort - deterministic import ordering
    "UP",   # pyupgrade - modern Python syntax
    "B",    # flake8-bugbear - likely bugs
    "SIM",  # flake8-simplify
    "D",    # pydocstyle - every module/class/function must be documented
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
